<!doctype html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Контакты</title>

    <link href="https://jsdelivr.net" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <script src="https://jsdelivr.net" defer></script>

    <script src="script.js" defer></script>

</head>

<body class="bg-light">

    <nav class="navbar navbar-expand bg-white shadow-sm mb-4">

        <div class="container">

            <div class="navbar-nav">

                <a class="nav-link text-dark" href="index.html">Главная</a>

                <a class="nav-link text-dark" href="about.html">О проекте</a>

                <a class="nav-link active fw-bold text-primary" href="contact.html">Контакты</a>

            </div>

        </div>

    </nav>


    <main class="container">

        <section id="contact" class="card p-4 shadow-sm text-center mx-auto mt-5" style="max-width: 500px;">

            <h1 class="mb-3 text-dark">Мои контакты</h1>

            <p class="text-muted">Если возникнут вопросы, со мной можно связаться через почту или форму ниже:</p>

            
 
            <div class="text-center mb-4">

                <a href="mailto:k.kadanceva@yandex.ru" class="btn btn-outline-primary fw-bold px-4">k.kadanceva@yandex.ru</a>

            </div>


                        
            <form id="contactForm" class="text-start">

                <div class="mb-2">

                    <input id="name" type="text" class="form-control" placeholder="Ваше имя">

                </div>

                <div class="mb-2">

                    <input id="email" type="text" class="form-control" placeholder="Ваш Email">

                </div>

                <div class="mb-3">

                    <textarea id="comment" class="form-control" rows="3" placeholder="Текст сообщения"></textarea>

                </div>

                <button type="submit" class="btn btn-primary w-100">Отправить сообщение</button>

            </form>


                      
            <p id="formMessage" class="mt-3 mb-0 fw-bold"></p>

        </section>

    </main>

</body>

</html>
